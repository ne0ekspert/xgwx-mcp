name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LIBXGWX_TEST_ROOT: ${{ github.workspace }}/libxgwx-fixtures
    defaults:
      run:
        working-directory: xgwx-mcp
    steps:
      - name: Check out MCP server
        uses: actions/checkout@v4
        with:
          path: xgwx-mcp
      # The published library omits fixtures. Keep test data separate from
      # the crates.io dependency, pinned to the release's source revision.
      - name: Check out libxgwx test fixtures
        uses: actions/checkout@v4
        with:
          repository: ne0ekspert/libxgwx
          ref: e0ae840f17ee6147c46b6bef62f8cd454609e460
          path: libxgwx-fixtures
          sparse-checkout: fixtures
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Rust formatting
        run: cargo fmt --check
      # Offline metadata resolves all platforms, including dependencies that
      # cargo test on Linux does not download or compile.
      - name: Fetch locked dependencies for offline metadata
        run: cargo fetch --locked
      - name: Run Rust and stdio integration tests
        run: cargo test --locked
      - name: Check instruction guides and source metadata
        run: python3 -m unittest discover -s tests -p 'test_instruction_*.py'
      - name: Build release server
        run: cargo build --release --locked
      - name: Verify CLI entry point
        run: ./target/release/xgwx-mcp --help
